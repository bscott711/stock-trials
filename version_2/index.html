<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Stock Trials</title>
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div id="helpOverlay" class="overlay">
        <div class="panel">
            <h1>Stock Trials</h1>
            <p class="tagline">The landscape is a stock chart. Ride it.</p>

            <dl class="controls">
                <dt><kbd>&rarr;</kbd> <kbd>D</kbd></dt><dd>Accelerate</dd>
                <dt><kbd>&larr;</kbd> <kbd>A</kbd></dt><dd>Brake</dd>
                <dt><kbd>Space</kbd></dt><dd>Jump</dd>
                <dt><kbd>&uarr;</kbd> <kbd>&darr;</kbd></dt><dd>Lean &mdash; hold in the air to flip</dd>
                <dt><kbd>R</kbd></dt><dd>Retry after a crash</dd>
                <dt><kbd>M</kbd></dt><dd>Mute music</dd>
                <dt><kbd>H</kbd></dt><dd>Show this again</dd>
            </dl>

            <p class="touch-only">On touch: <b>right</b> side accelerates, <b>left</b> brakes,
                <b>middle</b> jumps. Tilt to lean.</p>

            <button id="startBtn" class="start-btn">Click or press any key to ride</button>
        </div>
    </div>

    <button id="helpBtn" class="help-btn" title="Controls (H)" aria-label="Show controls">?</button>

    <button id="autoplayBlockedNotice" class="autoplay-notice">Click here to start music</button>
    <div id="currentTrack">Now Playing: Loading...</div>
    <div id="musicControls">
        <button class="control-btn" id="volumeDown">🔉</button>
        <button class="control-btn" id="volumeUp">🔊</button>
        <button class="control-btn" id="backBtn">⏮️</button>
        <button class="control-btn" id="pausePlay">⏸️</button>
        <button class="control-btn" id="skipBtn">⏭️</button>
        <input type="range" id="progressBar" class="progress-bar" min="0" max="100" value="0">
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
