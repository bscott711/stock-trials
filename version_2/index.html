<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Sky</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="currentTrack">Now Playing: Loading...</div>
    <div id="musicControls">

        <button class="control-btn" id="autoplayBlockedNotice" class="autoplay-notice">Click here to start music</button>
        <button class="control-btn" id="volumeDown">🔉</button>
        <button class="control-btn" id="volumeUp">🔊</button>
        <button class="control-btn" id="backBtn">⏮️</button>
        <button class="control-btn" id="pausePlay">⏸️</button>
        <button class="control-btn" id="skipBtn">⏭️</button>
        <input type="range" id="progressBar" class="progress-bar" min="0" max="100" value="0">
    </div>
    <canvas id="gameCanvas"></canvas>
    <!-- <script type="module" src="js/game.js"></script> -->
    <script type="module" src="js/game_qwen.js"></script>
</body>
</html>
