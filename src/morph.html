<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lunar Phase Simulation</title>
</head>
<body>
    <!-- SVG canvas with moon and animated lit area -->
    <svg width="400" height="400">
        <!-- Gray circle represents the shadowed moon -->
        <circle id="moonShadow" cx="200" cy="200" r="100" fill="gray"/>
        <!-- White path represents the lit area, updated dynamically -->
        <path id="litArea" d="M 200 300 C 0 300 0 100 200 100 A 100 100 0 1 1 200 300 Z" fill="white"/>
    </svg>

    <script>
        // Get the lit area path element
        const litArea = document.getElementById('litArea');
        let startTime = null;
        const duration = 4000; // Animation cycle duration in milliseconds (2 seconds)

        // Function to update the lit area's shape based on animation parameter t
        function updateLitArea(t) {
            // Calculate x-coordinates of Bézier control points (range: 0 to 400)
            const P1x = 400 * t;
            const P2x = 400 * t;
            // Define the path: Bézier curve from bottom to top, arc back along circle
            const d = `M 200 300 C ${P1x} 300 ${P2x} 100 200 100 A 100 100 0 1 1 200 300 Z`;
            litArea.setAttribute('d', d);
        }

        // Animation function using requestAnimationFrame
        function animate(timestamp) {
            if (!startTime) startTime = timestamp;
            const elapsed = timestamp - startTime;
            // Calculate t as a value from 0 to 1, looping every 2 seconds
            const t = (elapsed % duration) / duration;
            updateLitArea(t);
            requestAnimationFrame(animate); // Loop the animation
        }

        // Start the animation
        requestAnimationFrame(animate);
    </script>
</body>
</html>
