<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Astronomically Correct Lunar Phase Simulation</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #1a1a1a;
        }
        svg {
            border: 1px solid #333;
        }
    </style>
</head>
<body>
    <svg width="400" height="400">
        <!-- Gray circle for the shadowed moon -->
        <circle id="moonShadow" cx="200" cy="200" r="100" fill="#555"/>
        <!-- White path for the lit area -->
        <path id="litArea" fill="white"/>
    </svg>
    <script>
        const litArea = document.getElementById('litArea');
        let startTime = null;
        const duration = 8000; // 8 seconds for the full cycle

        function updateLitArea(t) {
            const phi = 360 * t;
            const rx = 100 * Math.abs(Math.cos(phi * Math.PI / 180));
            const largeArcFlag = (t > 0.25 && t < 0.75) ? 1 : 0;
            let d;

            if (t < 0.5) {
                // Waxing phases: lit area on the right
                d = `M 200 300 A 100 100 0 0 1 200 100 A ${rx} 100 0 ${largeArcFlag} 0 200 300 Z`;
            } else if (t > 0.5) {
                // Waning phases: lit area on the left
                d = `M 200 300 A 100 100 0 0 0 200 100 A ${rx} 100 0 ${largeArcFlag} 1 200 300 Z`;
            } else {
                // Full moon at t = 0.5
                d = `M 200 100 A 100 100 0 1 1 200 300 A 100 100 0 1 1 200 100 Z`;
            }

            litArea.setAttribute('d', d);
        }

        function animate(timestamp) {
            if (!startTime) startTime = timestamp;
            const elapsed = timestamp - startTime;
            const t = (elapsed % duration) / duration; // t loops from 0 to 1
            updateLitArea(t);
            requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);
    </script>
</body>
</html>
