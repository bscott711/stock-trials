<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moon Phase Visualization</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #222;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        canvas {
            background-color: #111;
            border-radius: 8px;
            margin: 20px 0;
        }

        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .slider-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 80%;
            max-width: 500px;
        }

        .phase-label {
            font-size: 1.2em;
            margin-top: 10px;
        }

        input[type="range"] {
            width: 100%;
        }

        .moon-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .moon-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .moon-label {
            margin-top: 5px;
            text-align: center;
        }
    </style>
</head>

<body>
    <h1>Moon Phase Visualization</h1>

    <div class="controls">
        <div class="slider-container">
            <input type="range" id="phaseSlider" min="0" max="1" step="0.01" value="0">
            <div class="phase-label">Phase: <span id="phaseValue">0.00</span></div>
        </div>
    </div>

    <canvas id="moonCanvas" width="800" height="200"></canvas>

    <div class="moon-row">
        <div class="moon-container">
            <canvas id="moonNew" width="100" height="100"></canvas>
            <div class="moon-label">New Moon<br>(0.0)</div>
        </div>
        <div class="moon-container">
            <canvas id="moonWaxingCrescent" width="100" height="100"></canvas>
            <div class="moon-label">Waxing Crescent<br>(0.125)</div>
        </div>
        <div class="moon-container">
            <canvas id="moonFirstQuarter" width="100" height="100"></canvas>
            <div class="moon-label">First Quarter<br>(0.25)</div>
        </div>
        <div class="moon-container">
            <canvas id="moonWaxingGibbous" width="100" height="100"></canvas>
            <div class="moon-label">Waxing Gibbous<br>(0.375)</div>
        </div>
        <div class="moon-container">
            <canvas id="moonFull" width="100" height="100"></canvas>
            <div class="moon-label">Full Moon<br>(0.5)</div>
        </div>
        <div class="moon-container">
            <canvas id="moonWaningGibbous" width="100" height="100"></canvas>
            <div class="moon-label">Waning Gibbous<br>(0.625)</div>
        </div>
        <div class="moon-container">
            <canvas id="moonLastQuarter" width="100" height="100"></canvas>
            <div class="moon-label">Last Quarter<br>(0.75)</div>
        </div>
        <div class="moon-container">
            <canvas id="moonWaningCrescent" width="100" height="100"></canvas>
            <div class="moon-label">Waning Crescent<br>(0.875)</div>
        </div>
    </div>

    <script>
        class MoonRenderer {
            constructor(canvasId) {
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext('2d');
                this.width = this.canvas.width;
                this.height = this.canvas.height;
            }

            clear() {
                this.ctx.fillStyle = "#111";
                this.ctx.fillRect(0, 0, this.width, this.height);
            }

            drawMoonWithPhase(x, y, radius, phase) {
                // Save the current context state
                this.ctx.save();

                // Draw the base moon (white circle)
                this.ctx.beginPath();
                this.ctx.arc(x, y, radius, 0, Math.PI * 2);
                this.ctx.fillStyle = "rgb(255, 255, 255)"; // Base white
                this.ctx.fill();

                // Handle special cases: New Moon (phase = 0 or 1) and Full Moon (phase ≈ 0.5)
                if (phase === 0 || phase === 1) {
                    // Fully dark for New Moon
                    this.ctx.beginPath();
                    this.ctx.arc(x, y, radius, 0, Math.PI * 2);
                    this.ctx.fillStyle = "rgba(50, 50, 50, 1)"; // Fully opaque shadow for New Moon
                    this.ctx.fill();
                } else if (Math.abs(phase - 0.5) < 0.03) { // Tolerance check for Full Moon
                    // Fully illuminated for Full Moon (no shadow needed)
                } else {
                    // Setup clipping region to only show within the moon circle
                    this.ctx.beginPath();
                    this.ctx.arc(x, y, radius, 0, Math.PI * 2);
                    this.ctx.clip();

                    // Calculate the shadow offset based on the phase
                    let offset;
                    if (phase < 0.5) {
                        // Waxing phases (New Moon to Full Moon)
                        // Offset moves from left edge (-radius) to center (0)
                        offset = -radius - (2 * (phase - 0.5) * radius);
                    } else {
                        // Waning phases (Full Moon to New Moon)
                        // Offset moves from right edge (+radius) to center (0)
                        offset = radius - (2 * (phase - 0.5) * radius);
                    }

                    // Draw the shadow circle with reduced opacity
                    this.ctx.beginPath();
                    this.ctx.arc(x + offset, y, radius, 0, Math.PI * 2);
                    this.ctx.fillStyle = "rgba(50, 50, 50, 0.95)"; // Semi-transparent shadow
                    this.ctx.fill();
                }

                // Restore the context state
                this.ctx.restore();
            }

            renderMoon(phase) {
                this.clear();
                const radius = Math.min(this.width, this.height) * 0.4;
                const centerX = this.width / 2;
                const centerY = this.height / 2;

                this.drawMoonWithPhase(centerX, centerY, radius, phase);
            }
        }

        // Main interactive moon
        const mainMoon = new MoonRenderer('moonCanvas');

        // Static moons for reference
        const moonNew = new MoonRenderer('moonNew');
        const moonWaxingCrescent = new MoonRenderer('moonWaxingCrescent');
        const moonFirstQuarter = new MoonRenderer('moonFirstQuarter');
        const moonWaxingGibbous = new MoonRenderer('moonWaxingGibbous');
        const moonFull = new MoonRenderer('moonFull');
        const moonWaningGibbous = new MoonRenderer('moonWaningGibbous');
        const moonLastQuarter = new MoonRenderer('moonLastQuarter');
        const moonWaningCrescent = new MoonRenderer('moonWaningCrescent');

        // Phase slider
        const phaseSlider = document.getElementById('phaseSlider');
        const phaseValue = document.getElementById('phaseValue');

        // Render static moons
        function renderStaticMoons() {
            moonNew.renderMoon(0.0);
            moonWaxingCrescent.renderMoon(0.125);
            moonFirstQuarter.renderMoon(0.25);
            moonWaxingGibbous.renderMoon(0.375);
            moonFull.renderMoon(0.5);
            moonWaningGibbous.renderMoon(0.625);
            moonLastQuarter.renderMoon(0.75);
            moonWaningCrescent.renderMoon(0.875);
        }

        // Update main moon with slider value
        phaseSlider.addEventListener('input', function () {
            const phase = parseFloat(this.value);
            phaseValue.textContent = phase.toFixed(2);
            mainMoon.renderMoon(phase);
        });

        // Initial render
        renderStaticMoons();
        mainMoon.renderMoon(parseFloat(phaseSlider.value));
    </script>
</body>

</html>
