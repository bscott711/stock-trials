<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lunar Phase Simulation</title>
</head>
<body>
    <svg width="400" height="400">
        <!-- Moon surface -->
        <circle cx="200" cy="200" r="150" fill="#333"/>
        
        <!-- Clipping path definition -->
        <clipPath id="phaseClip">
            <path id="morphingPath" d="M 200 350 C 0 350 0 50 200 50 L 400 50 L 400 350 Z"/>
        </clipPath>
        
        <!-- Illuminated part -->
        <circle cx="200" cy="200" r="150" fill="white" clip-path="url(#phaseClip)"/>
    </svg>

    <script>
        const path = document.getElementById('morphingPath');
        let startTime = null;
        const duration = 4000; // 2 seconds per cycle

        function updatePath(t) {
            // Calculate x-coordinates of control points
            const curvePosition = 400 * t;
            // Create smooth transition between phases
            const P1x = curvePosition;
            const P2x = curvePosition;
            
            // Update path data with closed shape for clipping
            const d = `M 200 350 
                       C ${P1x} 350 ${P2x} 50 200 50 
                       L 400 50 L 400 350 Z`;
            path.setAttribute('d', d);
        }

        function animate(timestamp) {
            if (!startTime) startTime = timestamp;
            const elapsed = timestamp - startTime;
            const t = (elapsed % duration) / duration;
            
            // Add easing for more natural phase transition
            const easedT = (Math.cos(t * Math.PI * 2 - Math.PI/2) + 1) / 2;
            
            updatePath(easedT);
            requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);
    </script>
</body>
</html>
